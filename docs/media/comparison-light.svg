<svg xmlns="http://www.w3.org/2000/svg" width="880" height="594" viewBox="0 0 880 594" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Snipping Tool UL compared with Windows Snipping Tool, ShareX, Greenshot and Flameshot</title>
<desc id="d">Start a snip: Snipping Tool UL 170 ms, Windows Snipping Tool 363 ms, ShareX 249 ms, Greenshot 265 ms, Flameshot not measured; Image on clipboard: Snipping Tool UL 50 ms, Windows Snipping Tool 91 ms, ShareX 144 ms, Greenshot 63 ms, Flameshot not measured; Memory while snipping: Snipping Tool UL 14 MB, Windows Snipping Tool 474 MB, ShareX 922 MB, Greenshot 133 MB, Flameshot not measured; Memory in the background: Snipping Tool UL 2.0 MB, Windows Snipping Tool 0 MB, ShareX 107 MB, Greenshot 45 MB, Flameshot 8.3 MB; Space on disk: Snipping Tool UL 9.6 MB, Windows Snipping Tool 420 MB, ShareX 517 MB, Greenshot 9.0 MB, Flameshot 95 MB. Lower is better.</desc>
